<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice Hub </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-3xl shadow-2xl p-6 sm:p-8 border border-slate-700 text-center">
        <!-- Logo Header -->
        <div class="w-16 h-16 bg-blue-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-500/30 text-3xl font-extrabold">
            √
        </div>
        <h1 class="text-2xl font-bold text-white mb-1">Interactive Math Platform</h1>
        <p class="text-slate-400 text-xs mb-6">Enter your name and choose your grade to begin</p>

        <!-- Form Inputs -->
        <div class="space-y-4 text-left">
            <!-- Input 1: Student Name -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Student Name / اسم الطالب:</label>
                <input type="text" id="student-name" placeholder="Enter your full name..." class="w-full px-4 py-3 rounded-xl border border-slate-600 bg-slate-700 text-white placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium text-sm">
            </div>

            <!-- Input 2: Grade Dropdown -->
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">Select Grade / اختر المرحلة الدراسية:</label>
                <select id="grade-select" class="w-full px-4 py-3 rounded-xl border border-slate-600 bg-slate-700 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all font-medium text-sm cursor-pointer">
                    <option value="" disabled selected>-- Select Grade --</option>
                    <option value="" disabled class="text-slate-500 bg-slate-800">Middle 1 (Prep 1) - Coming Soon 🔒</option>
                    <option value="middle2">Middle 2 (Prep 2)</option>
                    <option value="middle3">Middle 3 (Prep 3)</option>
                    <option value="" disabled class="text-slate-500 bg-slate-800">Senior 1 (Sec 1) - Coming Soon 🔒</option>
                    <option value="" disabled class="text-slate-500 bg-slate-800">Senior 2 (Sec 2) - Coming Soon 🔒</option>
                </select>
            </div>

            <!-- Error Message -->
            <p id="error-msg" class="text-xs text-red-400 font-semibold hidden text-center pt-1"></p>

            <!-- Submit Button -->
            <button onclick="startExam()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg shadow-blue-600/30 transition-all text-sm mt-2 flex items-center justify-center gap-2">
                <span>Start Practice Sheet</span>
                <span>→</span>
            </button>
        </div>

        <div class="mt-6 pt-4 border-t border-slate-700/60 text-[11px] text-slate-500">
            Interactive Sheets • Instant Results & Detailed Step-by-Step Solutions
        </div>
    </div>

    <script>
        function startExam() {
            const nameInput = document.getElementById('student-name').value.trim();
            const gradeSelect = document.getElementById('grade-select').value;
            const errorMsg = document.getElementById('error-msg');

            if (!nameInput) {
                errorMsg.innerText = "Please enter student full name first.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (!gradeSelect) {
                errorMsg.innerText = "Please select an active grade from the dropdown list.";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');

            // Save student name to localStorage so grade sheets can retrieve it
            localStorage.setItem('platform_student_name', nameInput);

            // Redirect to selected grade folder
            if (gradeSelect === 'middle2') {
                window.location.href = './middle2/index.html';
            } else if (gradeSelect === 'middle3') {
                window.location.href = './middle3/index.html';
            }
        }
    </script>
</body>
</html>
