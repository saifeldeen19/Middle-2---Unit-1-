<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Math Platform | Math Practice Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-emerald-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-emerald-900/90 backdrop-blur-md rounded-3xl shadow-2xl p-6 sm:p-8 border border-emerald-700/60 text-center">
        <!-- Logo Header -->
        <div class="w-16 h-16 bg-emerald-500 text-slate-950 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-emerald-500/30 text-3xl font-extrabold">
            √
        </div>
        <h1 class="text-2xl font-bold text-white mb-1">Interactive Math Platform</h1>
        <p class="text-emerald-200/80 text-xs mb-6">Enter your name and select your grade to begin practice</p>

        <!-- Form Inputs -->
        <div class="space-y-4 text-left">
            <!-- Input 1: Student Name -->
            <div>
                <label class="block text-xs font-semibold text-emerald-200 mb-1.5">Student Name:</label>
                <input type="text" id="student-name" placeholder="Enter your full name..." class="w-full px-4 py-3 rounded-xl border border-emerald-700 bg-emerald-950 text-white placeholder-emerald-400/60 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all font-medium text-sm">
            </div>

            <!-- Input 2: Grade Dropdown -->
            <div>
                <label class="block text-xs font-semibold text-emerald-200 mb-1.5">Select Grade:</label>
                <select id="grade-select" class="w-full px-4 py-3 rounded-xl border border-emerald-700 bg-emerald-950 text-white focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all font-medium text-sm cursor-pointer">
                    <option value="" disabled selected>-- Select Grade --</option>
                    <option value="" disabled class="text-emerald-500 bg-emerald-900">Middle 1 - Coming Soon 🔒</option>
                    <option value="middle2">Middle 2</option>
                    <option value="middle3">Middle 3</option>
                </select>
            </div>

            <!-- Error Message -->
            <p id="error-msg" class="text-xs text-rose-300 font-semibold hidden text-center pt-1"></p>

            <!-- Submit Button -->
            <button onclick="startPlatform()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-emerald-500/30 transition-all text-sm mt-2 flex items-center justify-center gap-2 cursor-pointer">
                <span>Start Practice Sheet</span>
                <span>→</span>
            </button>
        </div>

        <div class="mt-6 pt-4 border-t border-emerald-700/40 text-[11px] text-emerald-300/70">
            Mr. Saif Eldeen Sameh • Interactive Math Hub
        </div>
    </div>

    <script>
        function startPlatform() {
            const nameInput = document.getElementById('student-name').value.trim();
            const gradeSelect = document.getElementById('grade-select').value;
            const errorMsg = document.getElementById('error-msg');

            if (!nameInput) {
                errorMsg.innerText = "Please enter your full name first.";
                errorMsg.classList.remove('hidden');
                return;
            }

            if (!gradeSelect) {
                errorMsg.innerText = "Please select an active grade from the list.";
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');

            // Save name to browser memory so the grade sheet reads it automatically
            localStorage.setItem('platform_student_name', nameInput);

            // Redirect directly to the selected grade folder
            if (gradeSelect === 'middle2') {
                window.location.href = './middle2/index.html';
            } else if (gradeSelect === 'middle3') {
                window.location.href = './middle3/index.html';
            }
        }
    </script>
</body>
</html>
