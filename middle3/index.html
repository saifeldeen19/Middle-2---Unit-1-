<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شيت تفاعلي - الصف الثالث الإعدادي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen p-4">

    <!-- Top Bar with Student Name -->
    <div id="student-bar" class="max-w-4xl mx-auto mb-6 bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm flex justify-between items-center border border-slate-100 dark:border-slate-700">
        <div>
            <span class="text-xs text-slate-400 block">الطالب:</span>
            <span id="student-name-display" class="font-bold text-blue-600 dark:text-blue-400 text-sm">--</span>
        </div>
        <div>
            <a href="../index.html" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-xs font-bold rounded-xl transition-all">الرئيسية ⟵</a>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto bg-white dark:bg-slate-800 rounded-3xl shadow-xl p-6 sm:p-8 border border-slate-100 dark:border-slate-700 text-center">
        
        <!-- Welcome Screen (Hidden automatically, opens directly) -->
        <div id="welcome-screen" class="py-8">
            <h2 class="text-xl font-bold mb-3">جاري تحميل شيت الصف الثالث الإعدادي...</h2>
            <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
        </div>

        <!-- Quiz Container -->
        <div id="quiz-container" class="hidden text-right">
            <!-- Questions will be loaded here dynamically -->
        </div>

        <!-- Score Container -->
        <div id="score-container" class="hidden mt-6">
            <!-- Results here -->
        </div>

    </div>

    <script>
        let studentName = "";

        // أول ما الصفحة تفتح، اقرأ الاسم من الذاكرة وافتح الشيت فوراً
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('platform_student_name');
            
            if (!savedName) {
                // لو دخل الرابط مباشرة بدون ما يسجل في الرئيسية، يرجع للرئيسية
                window.location.href = '../index.html';
                return;
            }

            studentName = savedName;
            document.getElementById('student-name-display').innerText = studentName;
            
            // فتح الشيت مباشرة بدون شاشات ترحيب إضافية
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-container').classList.remove('hidden');
            
            // استدعاء الأسئلة الخاصة بك
            loadQuestion();
        });

        function loadQuestion() {
            // دالة تحميل الأسئلة الخاصة بك
            const quizDiv = document.getElementById('quiz-container');
            quizDiv.innerHTML = `<h3 class="text-lg font-bold mb-4">اختبار الوحدة الأولى - الصف الثالث الإعدادي</h3>
                                 <p class="text-sm text-slate-500">تم جلب اسم الطالب بنجاح وجاهز لعرض الأسئلة يا أستاذ سيف!</p>`;
        }
    </script>
</body>
</html>
